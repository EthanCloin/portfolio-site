name: Deploy static site to VPS

on:
  push:
    branches: [main]   # fires when PRs are merged into `main`
  workflow_dispatch:     # lets you trigger manually from the UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: autodeploy_nginx

    # Cancel an in-flight deploy if another push arrives
    concurrency:
      group: "deploy-${{ github.ref }}"
      cancel-in-progress: true

    steps:
    # 1. Check out the exact commit that just landed
    - uses: actions/checkout@v4

    # 2. Build: homepage is copied verbatim from public/, the blog is rendered into dist/blog
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
    - run: npm ci
    - run: npm run build

    # 3. Sync only the built site to the server (keeps .git, workflows, sources out of the web root)
    - name: Upload with rsync over SSH
      uses: easingthemes/ssh-deploy@v4
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        REMOTE_HOST: ${{ secrets.SSH_HOST }}
        REMOTE_USER: ${{ secrets.SSH_USER }}
        SOURCE: "dist/"
        TARGET: /var/www/html/ethancloin.xyz
        ARGS: "-avzr --delete"

    # 4. Reload nginx
    - name: Reload nginx
      uses: appleboy/ssh-action@v1
      with:
        host:     ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key:      ${{ secrets.SSH_KEY }}
        script:   |
          sudo systemctl reload nginx
