name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
    - run: npm ci
    - run: npm test
    - run: npm run build
    - name: Homepage must be byte-identical to public/index.html
      run: cmp dist/index.html public/index.html && cmp dist/style.css public/style.css
